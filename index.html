<style>
/* Layout: masaüstünde sol menü + geniş içerik; mobilde üst bar + alt sekme çubuğu, formlar alttan açılan sayfa (sheet) */
:root{
  /* Palet: logodaki camgöbeği (#00C2FF) marka rengi + logonun siyahından türetilmiş lacivert mürekkep; nötrler hafif camgöbeği eğilimli */
  --bg:#f1f6f9; --surface:#ffffff; --surface-2:#edf4f8; --ink:#0b1a24; --muted:#56697a; --line:#d6e2ea;
  --brand:#00c2ff; --accent:#0077b6; --accent-ink:#ffffff; --accent-soft:#dff4fd;
  --hero:#0b1a24; --hero-ink:#ffffff; --hero-val:#00c2ff;
  --ok:#14805a; --warn:#b26200; --bad:#c62a2a;
  --t-yet:#2f7fd1; --t-coc:#d9821a; --t-erg:#7a5bd4; --t-cift:#d2457c; --t-onl:#0f9f97;
  --shadow:0 1px 2px rgba(11,26,36,.05),0 6px 20px rgba(11,26,36,.07);
  --f-head:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09131a; --surface:#0f1c25; --surface-2:#142530; --ink:#e7f2f8; --muted:#8ea4b3; --line:#1f3340;
  --brand:#00c2ff; --accent:#2ec9ff; --accent-ink:#03131c; --accent-soft:#0b2d3d;
  --hero:#0c2c3c; --hero-ink:#e7f2f8; --hero-val:#4fd3ff;
  --ok:#43c98d; --warn:#f0a843; --bad:#f2766b;
  --t-yet:#6fa9ee; --t-coc:#eda055; --t-erg:#a68cf0; --t-cift:#ee7fab; --t-onl:#4fd0c6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#09131a; --surface:#0f1c25; --surface-2:#142530; --ink:#e7f2f8; --muted:#8ea4b3; --line:#1f3340;
  --brand:#00c2ff; --accent:#2ec9ff; --accent-ink:#03131c; --accent-soft:#0b2d3d;
  --hero:#0c2c3c; --hero-ink:#e7f2f8; --hero-val:#4fd3ff;
  --ok:#43c98d; --warn:#f0a843; --bad:#f2766b;
  --t-yet:#6fa9ee; --t-coc:#eda055; --t-erg:#a68cf0; --t-cift:#ee7fab; --t-onl:#4fd0c6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.45rem;font-weight:800}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Logo: orijinal logodan ayrıştırılmış iki katman (camgöbeği + beyaz). Beyaz kısım temaya göre mürekkep rengini alır, siyah zemin kullanılmaz. */
.logo{position:relative;display:inline-block;flex:none}
.logo i{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left center;mask-position:left center}
.logo .c{background:var(--brand)}
.logo .w{background:var(--ink)}

/* Shell */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;min-height:58px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:1.05rem;letter-spacing:-.02em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.top .ctx{margin-left:auto;display:flex;gap:8px;align-items:center;min-width:0}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px 5px 6px;min-height:40px;max-width:100%}

/* Generic UI */

.seg button,.seg label{border:0;background:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:.85rem;color:var(--muted);white-space:nowrap;cursor:pointer;display:flex;align-items:center}
.seg button.on,.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg-fit label{white-space:normal;text-align:center;line-height:1.2;padding:8px 6px;min-height:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}

.t-yet{--tc:var(--t-yet)} .t-coc{--tc:var(--t-coc)} .t-erg{--tc:var(--t-erg)} .t-cift{--tc:var(--t-cift)} .t-onl{--tc:var(--t-onl)}
.tchip{color:var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

"use strict";

const $=s=>document.querySelector(s);

const TLf=new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});

const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

function telHata(ids){for(const [id,ad,zorunlu] of ids){const el=document.getElementById(id);if(!el)continue;const v=el.value;
  if(!v&&!zorunlu)continue;if(!telOk(v,el.dataset.tel==='sabit')){telDurum(el);el.focus();return`${ad}: 10 haneli${el.dataset.tel==='sabit'?'':', 5 ile başlayan cep'} numarası girin (boşluksuz, başında 0 olmadan).`}}return''}

  if(!ilk&&!m[1]&&TC_KUCUK.has(w.toLocaleLowerCase('tr')))return w;return m[1]+m[2].toLocaleUpperCase('tr')+m[3]})}
const TC_SEC='h1,h2,.field>span,.lbl,.stat .k,.btn,.seg label,.seg button,.nv,.bnav span,.chip,.cmsg.baslik';

const SAATLER=Array.from({length:24},(_,i)=>pad(i)+':00'); /* 00:00–23:00 seans başlangıçları; her ekranda şubenin yönetici panelindeki açılış–kapanış saatine göre süzülür */
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

const OK={'Yetişkin Odası':'yet','Çocuk/Oyun Odası':'coc','Çift Odası':'cift','Online Oda':'onl','Skype Odası':'onl'};

function cakisma({tarih,saat,uzmanId,odaId,subeId,haricId,danisanId}){
  const e=[];const sb=B(subeId);const u=U(uzmanId);
  if(!tarih||!saat)return['Tarih ve saat seçin.'];
  if(sb&&(saat<sb.acilis||saat>=sb.kapanis))e.push(`Saat şube çalışma aralığı dışında (${sb.acilis}–${sb.kapanis}).`);
  if(parse(tarih).getDay()===0)e.push('Pazar günü şube kapalı.');
  if(u){
    if(!u.aktif)e.push('Uzman pasif durumda.');
    if((u.izinler||[]).includes(tarih))e.push(`${u.ad} bu tarihte izinli.`);
    const m=((u.musait||{})[subeId]||{})[parse(tarih).getDay()]||[];
    if(!m.includes(saat))e.push(`${u.ad} bu gün/saatte ${sb?sb.ad:''} şubesinde müsait değil.`);
  }
  S.seanslar.forEach(s=>{if(s.id===haricId||s.durum==='iptal'||s.tarih!==tarih||s.saat!==saat)return;
    if(s.uzmanId===uzmanId)e.push(`Uzmanın bu saatte başka seansı var (${B(s.subeId).ad} · ${D(s.danisanId).ad}).`);
    if(danisanId&&s.danisanId===danisanId&&s.uzmanId!==uzmanId)e.push(`Danışanın bu saatte başka seansı var (${B(s.subeId).ad} · ${U(s.uzmanId).ad}).`);
    if(odaId&&s.odaId===odaId)e.push(`${O(odaId).ad} dolu (${D(s.danisanId).ad}).`)});
  return[...new Set(e)];
}
function bosOda(subeId,tarih,saat,tur,haricId){
  const dolu=new Set(S.seanslar.filter(s=>s.id!==haricId&&s.durum!=='iptal'&&s.tarih===tarih&&s.saat===saat).map(s=>s.odaId));
  const pref=UYUM[tur]||[];
  return S.odalar.filter(o=>o.subeId===subeId&&!dolu.has(o.id)).sort((a,b)=>{const ia=pref.indexOf(a.tur),ib=pref.indexOf(b.tur);return(ia<0?9:ia)-(ib<0?9:ib)})[0]||null;
}
function takipEden(did){
  const l=S.seanslar.filter(s=>s.danisanId===did&&s.durum!=='iptal');
  if(!l.length){const d=D(did);return d&&d.takipUzman?{uzmanId:d.takipUzman,adet:d.arsiv||0,arsiv:true}:null}
  const c={};l.forEach(s=>c[s.uzmanId]=(c[s.uzmanId]||0)+1);
  const son=l.sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat))[0];
  return{uzmanId:son.uzmanId,adet:c[son.uzmanId]};
}

const SMSQ={k:[],t:null,ekle(x){SMSQ.k.push(x);if(!SMSQ.t)SMSQ.t=setTimeout(SMSQ.gonder,60)},
  async gonder(){SMSQ.t=null;const l=SMSQ.k.splice(0);if(!l.length)return;const gecerli=l.filter(x=>/^5\d{9}$/.test(normTel(x.tel)));const sonuc=new Map();let hata='';
    for(let i=0;i<gecerli.length;i+=300){const p=gecerli.slice(i,i+300);
      try{const o=await API.cagir('sms',{mesajlar:p.map(x=>({tel:normTel(x.tel),metin:x.metin}))});const atl=new Set(o.atlanan||[]);p.forEach(x=>sonuc.set(x.id,o.simulasyon?'Simülasyon':atl.has(normTel(x.tel))?'Test modu · gönderilmedi':'Gönderildi'))}
      catch(e){hata=e.message;p.forEach(x=>sonuc.set(x.id,'Gönderilemedi'))}}

    if(hata)toast('SMS gönderilemedi: '+hata,1);commit()}};

function kasa(subeId,b,e,uzmanId){
  const r={tahsilat:0,kdv:0,matrah:0,ofis:0,uzman:0,nakit:0,havale:0,adet:0,masraf:0,uz:{}};
  S.seanslar.forEach(s=>{if(s.durum!=='odendi'||s.tarih<b||s.tarih>e)return;if(subeId&&s.subeId!==subeId)return;if(uzmanId&&s.uzmanId!==uzmanId)return;
    const o=s.odeme;r.tahsilat+=o.tahsilat;r.kdv+=o.kdv;r.matrah+=o.matrah;r.ofis+=o.ofis;r.uzman+=o.uzman;r.adet++;
    if(o.kanal==='Nakit')r.nakit+=o.tahsilat;else if(o.kanal==='Havale/EFT')r.havale+=o.tahsilat;
    const x=r.uz[s.uzmanId]=r.uz[s.uzmanId]||{adet:0,brut:0,ofis:0,uzman:0,kdv:0};x.adet++;x.brut+=o.tahsilat;x.ofis+=o.ofis;x.uzman+=o.uzman;x.kdv+=o.kdv});
  S.masraflar.forEach(m=>{if(m.tarih<b||m.tarih>e)return;if(subeId&&m.subeId!==subeId)return;r.masraf+=m.tutar});
  r.net=r.ofis-r.masraf;return r}

  UI.smsSel=UI.smsSel&&UI.smsSel.t===t?UI.smsSel:{t,ids:new Set(list.map(s=>s.id))};
  const sel=list.filter(s=>UI.smsSel.ids.has(s.id));const nAl=sel.reduce((a,s)=>a+alicilar(D(s.danisanId)).length,0);
  const log=S.smsLog.filter(l=>l.subeId===UI.subeId).slice(0,12);
  return`<div class="page-head"><div><h1>Toplu SMS</h1><p>${S.netgsm.kod?`NetGSM bağlı · başlık ${esc(S.netgsm.baslik)}`:'NetGSM hesabı tanımlı değil · gönderimler simülasyon olarak kaydedilir'}</p></div></div>
  <div class="form-grid">
  <div class="card"><div class="card-h"><h2>Seanslar</h2><input type="date" class="inp" style="width:auto;min-height:40px" value="${t}" data-chg="smsTarih" aria-label="Tarih"></div>
   ${list.length?`<label class="chk"><input type="checkbox" id="smsAll" data-chg="smsTum" ${sel.length===list.length?'checked':''}> <b>Tümünü seç</b> <span class="muted small">(${list.length} seans)</span></label>
   <div class="dl">${list.map(s=>{const d=D(s.danisanId);const a=alicilar(d);return`<label class="row" style="display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer"><input type="checkbox" style="width:20px;height:20px;accent-color:var(--accent)" data-chg="smsSec" data-id="${s.id}" ${UI.smsSel.ids.has(s.id)?'checked':''}><span style="min-width:0"><b>${s.saat} · ${esc(d.ad)}</b><span class="mt" style="display:block;font-size:.8rem;color:var(--muted)">${esc(U(s.uzmanId).ad)} · ${a.length?a.map(x=>esc(x.ad.split(' ')[0])).join(', '):'SMS izni yok'}</span></span><span class="small muted">${a.length} alıcı</span></label>`}).join('')}</div>`:`<div class="empty"><b>${fmtD(t,{day:'numeric',month:'long'})} için bekleyen seans yok</b>Başka bir tarih seçin.</div>`}
  </div>
  <div class="card"><h2>Mesaj</h2>
   <div class="smsprev">${sel.length?esc(doldur(sablonAl(sel[0].subeId,'d_hatirlatma'),sel[0])):'<span class="muted">Önizleme için seans seçin.</span>'}</div>
   <span class="small muted">Şablon Yönetici &gt; SMS Merkezi’nden düzenlenir. Her danışana kendi bilgileriyle gönderilir.</span>
   <label class="sw"><span>Uzmanlara da seans bilgisini gönder</span><input type="checkbox" id="smsUz" checked><i></i></label>
   <button class="btn primary lg block" data-act="smsGonder" ${sel.length?'':'disabled'}>${ic('send')}${sel.length} seans · ${nAl} danışan SMS’i gönder</button>
   <h3 style="margin-top:8px">Son gönderimler</h3>
   ${log.length?`<div class="hist">${log.map(l=>`<div><b class="small">${new Date(l.zaman).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</b><span class="small">${esc(l.alici)} · ${l.tip}</span><span class="badge b-pasif">${l.durum}</span></div>`).join('')}</div>`:'<span class="small muted">Henüz gönderim yok.</span>'}
  </div></div>`}

/* ============ Firma raporu ============ */
function firmaListe(fid,b,e,subeId){return S.seanslar.filter(s=>s.durum!=='iptal'&&s.kaynak==='firma'&&s.firmaId===fid&&s.tarih>=b&&s.tarih<=e&&(!subeId||s.subeId===subeId)).sort((a,c)=>(a.tarih+a.saat).localeCompare(c.tarih+c.saat))}
function vFirma(){if(UI.per.tip==='gun'||UI.per.tip==='hafta'){UI.per.tip='ay'}
  const fs=S.firmalar.filter(f=>f.subeIds.includes(UI.subeId));UI.fsec=fs.some(f=>f.id===UI.fsec)?UI.fsec:(fs[0]||{}).id;
  const[b,e]=perRange();const list=UI.fsec?firmaListe(UI.fsec,b,e,UI.subeId):[];const dset=[...new Set(list.map(s=>s.danisanId))];const tam=list.filter(s=>s.durum==='odendi').length;
  return`<div class="page-head"><div><h1>Firma Raporu</h1><p>Anlaşmalı kurumların bu şubedeki seans dökümü</p></div></div>
  ${perBar(['ay','ozel'])}
  ${fs.length?`<div class="toolbar"><select class="inp" style="width:auto" data-chg="firmaSec" aria-label="Firma">${fs.map(f=>`<option value="${f.id}" ${f.id===UI.fsec?'selected':''}>${esc(f.ad)}</option>`).join('')}</select>
  <button class="btn" data-act="csv" ${list.length?'':'disabled'}>${ic('dl')}Excel / CSV indir</button><button class="btn ghost" data-act="csvKopya" ${list.length?'':'disabled'}>${ic('copy')}Kopyala</button></div>
  <div class="stats"><div class="stat"><span class="k">Firma kapsamında seans</span><span class="v">${list.length}</span><span class="d">${tam} tamamlandı · ${list.length-tam} planlı/bekleyen</span></div><div class="stat"><span class="k">Danışan</span><span class="v">${dset.length}</span><span class="d">Firma kapsamında görüşen</span></div></div>
  ${list.length?`<div class="tw"><table class="tbl"><thead><tr><th>Tarih</th><th>Danışan</th><th>Uzman</th><th>Tür</th><th>Durum</th></tr></thead><tbody>${list.map(s=>`<tr><td class="num">${fmtD(s.tarih,{day:'2-digit',month:'2-digit',year:'numeric'})} ${s.saat}</td><td>${esc(D(s.danisanId).ad)}</td><td>${esc(U(s.uzmanId).ad)}</td><td>${s.tur||'—'}</td><td>${sBadge(s)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">Toplam</td><td>${list.length} seans</td></tr></tfoot></table></div>`:'<div class="empty"><b>Bu dönemde firma seansı yok</b></div>'}`
  :'<div class="empty"><b>Bu şubeye tanımlı kurumsal firma yok</b>Yönetici panelinden firma ekleyebilirsiniz.</div>'}`}
function csvMetni(){const[b,e]=perRange();const list=firmaListe(UI.fsec,b,e,UI.subeId);const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
  return['Tarih;Saat;Danışan;Uzman;Tür;Durum'].concat(list.map(s=>[s.tarih,s.saat,D(s.danisanId).ad,U(s.uzmanId).ad,s.tur||'',s.durum==='odendi'?'Tamamlandı':durumAd[s.durum]].map(q).join(';'))).join('\n')}

/* ============ YÖNETİCİ ============ */

  const[b,e]=perRange();const k=kasa(null,b,e);
  const unpaid=S.seanslar.filter(s=>s.durum==='bekliyor'&&gecti(s)).length;
  const gelecek=S.seanslar.filter(s=>s.durum==='bekliyor'&&s.tarih>=TODAY&&s.tarih<=addDays(TODAY,7)).length;
  const uzRows=Object.entries(k.uz).sort((a,c)=>c[1].brut-a[1].brut);
  return`<div class="page-head"><div><h1>Genel bakış</h1><p>Tüm şubeler · ${perLabel()}</p></div></div>
  ${perBar()}
  <div class="stats">
   <div class="stat hero"><span class="k">Net ofis kârı</span><span class="v">${TL(k.net)}</span><span class="d">Brüt − KDV − hak ediş − gider</span></div>
   <div class="stat"><span class="k">Brüt ciro</span><span class="v">${TL(k.tahsilat)}</span><span class="d">${k.adet} ödenmiş seans</span></div>
   <div class="stat"><span class="k">Ayrılan KDV havuzu</span><span class="v">${TL(k.kdv)}</span></div>
   <div class="stat"><span class="k">Uzman hak ediş toplamı</span><span class="v">${TL(k.uzman)}</span></div>
   <div class="stat"><span class="k">Genel masraflar</span><span class="v">${TL(k.masraf)}</span></div>
  </div>
  <div class="stats"><div class="stat"><span class="k" style="color:var(--warn)">${ic('alert')}Tahsilatı girilmemiş</span><span class="v">${unpaid}</span><span class="d">geçmiş seans</span></div><div class="stat"><span class="k">Önümüzdeki 7 gün</span><span class="v">${gelecek}</span><span class="d">planlı randevu</span></div><div class="stat"><span class="k">Danışanlar</span><span class="v">${S.danisanlar.length.toLocaleString('tr-TR')}</span><span class="d">${S.uzmanlar.filter(u=>u.aktif).length} aktif uzman</span></div></div>
  <div class="card"><div class="card-h"><h2>Şube karşılaştırması</h2><span class="small muted">Gözlem modu ile şube asistan paneline geçebilirsiniz</span></div>
  <div class="tw"><table class="tbl"><thead><tr><th>Şube</th><th class="r">Seans</th><th class="r">Brüt</th><th class="r">KDV</th><th class="r">Hak ediş</th><th class="r">Gider</th><th class="r">Net kâr</th><th></th></tr></thead><tbody>
  ${S.subeler.map(sb=>{const x=kasa(sb.id,b,e);return`<tr><td><b>${esc(sb.ad)}</b></td><td class="r">${x.adet}</td><td class="r">${TL(x.tahsilat)}</td><td class="r">${TL(x.kdv)}</td><td class="r">${TL(x.uzman)}</td><td class="r">${TL(x.masraf)}</td><td class="r"><b>${TL(x.net)}</b></td><td class="r"><button class="btn sm" data-act="gozlem" data-v="${sb.id}">${ic('eye')}Gözlem</button></td></tr>`}).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Uzman performansı</h2>${uzRows.length?`<div class="tw"><table class="tbl"><thead><tr><th>Uzman</th><th class="r">Seans</th><th class="r">Brüt</th><th class="r">Ofis payı</th><th class="r">Hak ediş</th></tr></thead><tbody>${uzRows.map(([id,x])=>`<tr><td>${esc(U(id).ad)}${U(id).aktif?'':' <span class="badge b-pasif">Pasif</span>'}</td><td class="r">${x.adet}</td><td class="r">${TL(x.brut)}</td><td class="r">${TL(x.ofis)}</td><td class="r">${TL(x.uzman)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>Bu dönemde veri yok</b></div>'}</div>`}

function vSubeler(){return`<div class="page-head"><div><h1>Şubeler & Odalar</h1><p>${S.subeler.length} şube · ${S.odalar.length} oda</p></div><button class="btn primary" data-act="subeDuz" data-id="">${ic('plus')}Şube ekle</button></div>

   <button class="btn sm" data-act="odaDuz" data-id="" data-s="${sb.id}">${ic('plus')}Oda ekle</button></div>`}).join('')}</div>`}

function vUzmanlar(){UI.uzf=UI.uzf||'aktif';
  return`<div class="page-head"><div><h1>Uzmanlar</h1><p>Hak ediş oranları, şube atamaları ve gizlilik izinleri</p></div><button class="btn primary" data-act="uzDuz" data-id="">${ic('plus')}Uzman ekle</button></div>
  <div class="toolbar"><div class="search">${ic('search')}<input id="uzq" placeholder="Uzman ara (ad, telefon, şube, alan)" value="${esc(UI.uzq||'')}" data-in="uzAra" aria-label="Uzman ara" autocomplete="off"></div>
  <div class="seg"><button class="${UI.uzf==='aktif'?'on':''}" data-act="uzf" data-v="aktif">Aktif (${S.uzmanlar.filter(u=>u.aktif).length})</button><button class="${UI.uzf==='pasif'?'on':''}" data-act="uzf" data-v="pasif">Pasif / arşiv (${S.uzmanlar.filter(u=>!u.aktif).length})</button></div></div>
  <div id="uzList">${uzListHTML()}</div>`}
function uzListHTML(){const q=(UI.uzq||'').trim();const ql=low(q),qd=digits(q);
  const list=S.uzmanlar.filter(u=>UI.uzf==='aktif'?u.aktif:!u.aktif).filter(u=>!q||low(u.ad).includes(ql)||low(u.email).includes(ql)||(qd.length>=3&&digits(u.tel).includes(qd))||u.alanlar.some(a=>low(a).includes(ql))||u.subeIds.some(id=>B(id)&&low(B(id).ad).includes(ql)));
  if(!list.length)return q?`<div class="empty"><b>“${esc(q)}” ile eşleşen uzman yok</b>Aramayı değiştirin veya ${UI.uzf==='aktif'?'pasif':'aktif'} uzmanlara bakın.</div>`:`<div class="empty"><b>${UI.uzf==='aktif'?'Aktif':'Pasif'} uzman yok</b>${UI.uzf==='aktif'?'':'Ayrılan uzmanlar burada geçmiş kayıtlarıyla saklanır.'}</div>`;
  return`<div class="grid2">${list.map(u=>`<button class="lc" data-act="uzDuz" data-id="${u.id}"><div class="lc-h"><div><b>${hl(u.ad,q)}</b><div class="small muted">${esc(u.email)} · ${esc(u.tel)}</div></div>${u.aktif?'':'<span class="badge b-pasif">Pasif</span>'}</div>
   <div class="chips">${u.alanlar.map(tchip).join('')}</div>
   <div class="meta"><span>Şube <strong>${u.subeIds.map(id=>esc(B(id)?B(id).ad:'')).join(', ')}</strong></span><span>Kendi danışanı ofis payı <strong class="num">%${u.oranKendi}</strong></span><span>Ofis danışanı ofis payı <strong class="num">%${u.oranYonlendirme}</strong></span><span>Telefon görür <strong>${u.telGor?'Evet':'Hayır'}</strong></span><span>SMS <strong>${u.sms?'Açık':'Kapalı'}</strong></span></div></button>`).join('')}</div>`}
function uzDuz(id){const u=id?U(id):{ad:'',tel:'',email:'',sifre:'',alanlar:['Yetişkin'],subeIds:[UI.subeId||S.subeler[0].id],oranKendi:30,oranYonlendirme:50,telGor:true,sms:true,aktif:true};
  sheet(id?'Uzmanı düzenle':'Yeni uzman',`${fld('Ad soyad / unvan',`<input id="u_ad" value="${esc(u.ad)}" placeholder="Uzm. Psk. Ad Soyad">`)}
  <div class="row2">${fld('Telefon',`<input id="u_tel" type="tel" data-tel inputmode="numeric" placeholder="5XXXXXXXXX" autocomplete="off" value="${esc(u.tel)}">`)}${fld('E-posta (giriş)',`<input id="u_email" type="email" value="${esc(u.email)}">`)}</div>
  ${fld('Giriş şifresi',`<input id="u_sifre" type="text" autocomplete="off" value="${SUNUCU?'':esc(u.sifre)}" placeholder="${SUNUCU?(id?'Değiştirmek için yeni şifre':'En az 10 karakter'):''}">`)}
  <div><span class="lbl">Uzmanlık alanları</span><div class="chips" style="margin-top:6px">${TURLER.map(t=>`<label class="chip"><input type="checkbox" name="u_alan" value="${t}" ${u.alanlar.includes(t)?'checked':''}>${t}</label>`).join('')}</div></div>
  <div><span class="lbl">Görev yaptığı şubeler</span><div class="chips" style="margin-top:6px">${S.subeler.map(s=>`<label class="chip"><input type="checkbox" name="u_sube" value="${s.id}" ${u.subeIds.includes(s.id)?'checked':''}>${esc(s.ad)}</label>`).join('')}</div></div>
  <div class="row2">${fld('Kendi danışanı · ofis payı %',`<input id="u_ok" type="number" min="0" max="100" value="${u.oranKendi}">`)}${fld('Ofis danışanı · ofis payı %',`<input id="u_oy" type="number" min="0" max="100" value="${u.oranYonlendirme}">`)}</div>

  ${fld('Online görüşme linki',`<input id="u_link" type="url" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="https://meet.google.com/... veya Zoom linki" value="${esc(u.onlineLink||'')}">`)}

  <label class="sw"><span>Seans bilgilendirme SMS’i alsın</span><input type="checkbox" id="u_sms" ${u.sms?'checked':''}><i></i></label>
  ${id&&u.aktif?(()=>{const n=S.seanslar.filter(s=>s.uzmanId===id&&s.durum==='bekliyor'&&!gecti(s)).length;return n?`<div class="small muted">${n} aktif seansı olduğu için şu an pasife alınamaz.</div>`:''})():''}`,

   return`<button class="lc" data-act="firmaDuz" data-id="${f.id}"><div class="lc-h"><div><b>${esc(f.ad)}</b><div class="small muted">${esc(f.vergi)}</div></div><span class="badge b-firma">${dn} danışan</span></div>

  sheet(id?'Firmayı düzenle':'Yeni kurumsal firma',`${fld('Firma / kurum adı',`<input id="f_ad" value="${esc(f.ad)}">`)}
  <div class="row2">${fld('Vergi dairesi / no',`<input id="f_vergi" value="${esc(f.vergi)}">`)}${fld('Yetkili / iletişim',`<input id="f_yet" value="${esc(f.yetkili)}">`)}</div>

/* ============ Veri aktarımı (eski sistem CSV) ============ */
function csvParse(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"'&&f==='')q=true;else if(c===';'){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
const tarihCevir=t=>{const m=String(t||'').trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:''};
const saatCevir=t=>{const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?pad(m[1])+':'+m[2]:''};
const sayi=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isFinite(n)?n:null};
const isimDuzelt=t=>String(t||'').replace(/\s+/g,' ').trim();
function odaTurTahmin(ad){const a=low(ad);if(/çocuk|cocuk|kum|oyun/.test(a))return'Çocuk/Oyun Odası';if(/çift|cift/.test(a))return'Çift Odası';if(/skype/.test(a))return'Skype Odası';if(/online|çevrim|cevrim/.test(a))return'Online Oda';return'Yetişkin Odası'}
function aktarimHazirla(text){
  const rows=csvParse(text.replace(/^﻿/,'')).filter(r=>r.length>1);if(rows.length<2)throw new Error('Dosyada kayıt bulunamadı.');
  const H=rows[0].map(h=>h.trim());const gerek=['randevu_uuid','randevu_tarihi','randevu_saati','lokasyon_uuid','T_Lokasyon','psk_uuid','T_SecilenPsk','oda_uuid','T_SecilenOda','danisan_uuid','danisan_name','isIptal'];
  const eksik=gerek.filter(g=>!H.includes(g));if(eksik.length)throw new Error('Bu dosya beklenen randevu dışa aktarımı değil. Eksik sütunlar: '+eksik.join(', '));
  const R=rows.slice(1).map(r=>{const o={};H.forEach((h,i)=>o[h]=(r[i]||'').trim());return o}).filter(o=>o.randevu_uuid);
  R.forEach(o=>{o._t=tarihCevir(o.randevu_tarihi);o._h=saatCevir(o.randevu_saati)});
  const hatali=R.filter(o=>!o._t||!o._h).length;const K=R.filter(o=>o._t&&o._h).sort((a,b)=>(a._t+a._h).localeCompare(b._t+b._h));
  const simdi=nowH();
  // şubeler
  const subeMap=new Map();K.forEach(o=>{if(!subeMap.has(o.lokasyon_uuid))subeMap.set(o.lokasyon_uuid,{ad:(o.T_Lokasyon.match(/\(([^)]+)\)/)||[0,o.T_Lokasyon])[1].trim()||'Şube',saatler:new Set()});subeMap.get(o.lokasyon_uuid).saatler.add(o._h)});
  const subeler=[];let ai=0;subeMap.forEach((v,k)=>{const es=S.subeler.find(b=>low(b.ad)===low(v.ad));const sa=[...v.saatler].sort();ai++;
    const kap=pad(Math.min(24,parseInt(sa[sa.length-1])+1))+':00';
    subeler.push({id:'b'+k.slice(0,8),_k:k,ad:v.ad,adres:es?es.adres:'',harita:es?es.harita:'',tel:es?es.tel:'',acilis:es&&es.acilis<sa[0]?es.acilis:sa[0],kapanis:es&&es.kapanis>kap?es.kapanis:kap,
      asistan:es&&es.asistan?{...es.asistan}:{email:`asistan${ai}@asistpsikolog.com`,sifre:'demo1234'}})});
  const subeId=new Map(subeler.map(b=>[b._k,b.id]));subeler.forEach(b=>delete b._k);
  // odalar
  const odaMap=new Map();K.forEach(o=>{if(!odaMap.has(o.oda_uuid))odaMap.set(o.oda_uuid,{id:'r'+o.oda_uuid.slice(0,8),subeId:subeId.get(o.lokasyon_uuid),ad:isimDuzelt(o.T_SecilenOda)||'Oda',tur:odaTurTahmin(o.T_SecilenOda)})});
  const odalar=[...odaMap.values()];
  // uzmanlar (aynı isimli kayıtlar birleştirilir)
  const uzAd=new Map(),uzUuid=new Map(),birlesen=new Set();
  K.forEach(o=>{const ad=isimDuzelt(o.T_SecilenPsk)||'İsimsiz uzman';const key=low(ad);
    if(!uzAd.has(key))uzAd.set(key,{id:'u'+o.psk_uuid.slice(0,8),ad,uuids:new Set(),subeIds:new Set(),son:'',yuzde:50,tel:'',sms:true});
    const u=uzAd.get(key);u.uuids.add(o.psk_uuid);u.subeIds.add(subeId.get(o.lokasyon_uuid));u.son=o._t;const y=sayi(o.psk_default_yuzde);if(y!=null)u.yuzde=y;if(o.psk_contac)u.tel=normTel(o.psk_contac);u.sms=o.psk_sms_service!=='0'});
  const uuidAd=new Map();K.forEach(o=>{const a=isimDuzelt(o.T_SecilenPsk);if(!uuidAd.has(o.psk_uuid))uuidAd.set(o.psk_uuid,new Set());uuidAd.get(o.psk_uuid).add(low(a))});
  uzAd.forEach(u=>{if(u.uuids.size>1)birlesen.add(u.ad);u.uuids.forEach(x=>uzUuid.set(x,u.id))});
  const sinir=addDays(TODAY,-180);
  const uzmanlar=[...uzAd.values()].map(u=>{const musait={};[...u.subeIds].forEach(sid=>{const b=subeler.find(x=>x.id===sid);musait[sid]={};for(let g=1;g<=6;g++)musait[sid][g]=SAATLER.filter(h=>h>=b.acilis&&h<b.kapanis)});
    return{id:u.id,ad:u.ad,tel:u.tel,email:'',sifre:'',alanlar:[...TURLER],subeIds:[...u.subeIds],oranKendi:u.yuzde,oranYonlendirme:u.yuzde,telGor:true,sms:u.sms,aktif:u.son>=sinir,musait,izinler:[]}});
  // danışanlar
  const dMap=new Map();K.forEach(o=>{if(!dMap.has(o.danisan_uuid))dMap.set(o.danisan_uuid,[]);dMap.get(o.danisan_uuid).push(o)});
  let telHatali=0;
  const danisanlar=[...dMap.entries()].map(([k,l])=>{const son=l[l.length-1];const sube={};l.forEach(o=>sube[o.lokasyon_uuid]=(sube[o.lokasyon_uuid]||0)+1);
    const sb=Object.entries(sube).sort((a,b)=>b[1]-a[1])[0][0];const tel=normTel(son.danisan_contac);if(!telOk(tel))telHatali++;
    const vr=[...l].reverse().find(o=>o.isParent==='1'&&o.parentName&&low(isimDuzelt(o.parentName))!==low(isimDuzelt(son.danisan_name)));const sonGeldi=[...l].reverse().find(o=>o.isIptal!=='1')||son;
    return{id:'d'+k.slice(0,12),ad:isimDuzelt(son.danisan_name)||'İsimsiz danışan',tel,subeId:subeId.get(sb),tur:'',es:null,anne:null,baba:null,
      veli:vr?{ad:isimDuzelt(vr.parentName),tel:normTel(vr.parentPhone.replace(/\.0$/,''))}:null,
      sms:{ana:son.isDanisanSms!=='0',es:false,anne:false,baba:false,veli:son.parentSms==='1'},firmaId:null,arsiv:0,
      takipUzman:uzUuid.get(sonGeldi.psk_uuid),sahipUzmanId:null,kayit:tarihCevir(l[0].createdAt)||l[0]._t}});
  const dId=new Map([...dMap.keys()].map(k=>[k,'d'+k.slice(0,12)]));
  // seanslar
  const ust={Nakit:0,'Havale/EFT':0};let gecmisOdemesiz=0;
  const seanslar=K.map(o=>{const iptal=o.isIptal==='1';const gecti=o._t<TODAY||(o._t===TODAY&&parseInt(o._h)<=simdi);
    const al=sayi(o.p_AlinanOdeme);const oran=sayi(o.p_OfisPayi)??sayi(o.psk_default_yuzde)??50;
    const s={id:'i'+o.randevu_uuid.slice(0,13),danisanId:dId.get(o.danisan_uuid),uzmanId:uzUuid.get(o.psk_uuid),subeId:subeId.get(o.lokasyon_uuid),odaId:'r'+o.oda_uuid.slice(0,8),
      tarih:o._t,saat:o._h,tur:'',kaynak:'',firmaId:null,ucret:al??0,durum:iptal?'iptal':gecti?'odendi':'bekliyor',odeme:null,sadeceEbeveyn:false,not:o.asist_note||'',aktarim:1};
    if(iptal&&o.iptalSebebi)s.not=(s.not?s.not+' · ':'')+'İptal: '+o.iptalSebebi;
    if(!iptal&&gecti){const t=al??0;if(al==null)gecmisOdemesiz++;const of=sayi(o.p_OfiseKalan),ps=sayi(o.p_PsikologKalan);
      const ofis=of!=null&&ps!=null?of:t*oran/100,uz=of!=null&&ps!=null?ps:t-ofis;const kanal=o.p_OdemeKimde==='nakit'?'Nakit':o.p_OdemeKimde==='bank'?'Havale/EFT':'';
      s.odeme={tahsilat:t,kdv:0,matrah:t,ofis,uzman:uz,kdvOran:0,oran,kanal,tarih:o._t};if(ust[kanal]!=null)ust[kanal]+=t}

  const ozet={satir:R.length,hatali,seans:seanslar.length,iptal:seanslar.filter(x=>x.durum==='iptal').length,odendi:seanslar.filter(x=>x.durum==='odendi').length,bekliyor:seanslar.filter(x=>x.durum==='bekliyor').length,
